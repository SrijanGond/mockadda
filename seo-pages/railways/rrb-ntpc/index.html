<script>
// ── LANGUAGE TOGGLE ──────────────────────────────────────────────────────────
// ── LANGUAGE TOGGLE — UNIVERSAL RULE FOR EVERY EXAM ─────────────────────────
// Rule (applies to SSC, Banking, Teaching, Railways, Police — every exam on
// the site, driven by subject name, not by which exam/file it came from):
//   - Subjects that test English or Hindi language ability directly (subject
//     name contains "english" or "hindi") -> toggle is DISABLED. A real exam
//     paper never lets you translate a language-skill question.
//   - Every other subject (Maths, GK, Reasoning, Polity, Current Affairs,
//     etc.) -> toggle works normally when a Hindi version exists.
// This check runs off q.subject itself, so it self-enforces even if a given
// exam's JSON still has a stray q_hi value left on a language question.
function isLanguageSkillSubject(subject){
  const s = (subject || '').toLowerCase();
  return s.includes('english') || s.includes('hindi');
}
function setLang(lang) {
  S.lang = lang;
  document.getElementById('btnEN').className = lang==='en' ? 'active' : 'inactive';
  document.getElementById('btnHI').className = lang==='hi' ? 'active' : 'inactive';
  render();
}

function syncLangToggleForQuestion(q){
  const hiBtn = document.getElementById('btnHI');
  if(!hiBtn) return;
  const languageSkillSubject = isLanguageSkillSubject(q && q.subject);
  const hasHindiVersion = !!(q && q.q_hi) && !languageSkillSubject;
  hiBtn.disabled = !hasHindiVersion;
  hiBtn.title = hasHindiVersion ? '' : 'This question tests English/Hindi language ability directly, so it isn\'t translated — matching the real exam pattern.';
  // If the student had switched to Hindi on a bilingual question and then
  // navigates to a language-skill or one-language-only question, silently
  // fall back to EN for this view without losing their toggle preference
  // for other questions.
  if(!hasHindiVersion && S.lang==='hi'){
    document.getElementById('btnEN').className='active';
    document.getElementById('btnHI').className='inactive';
  }
}
function resetLangToggleAvailability(){
  const hiBtn = document.getElementById('btnHI');
  if(!hiBtn) return;
  hiBtn.disabled = false;
  hiBtn.title = '';
}

// ── STATE ────────────────────────────────────────────────────────────────────
let DATA = {};

// Web App URL for the "Report Question" Apps Script endpoint.
const REPORT_ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbwhpPRtQRqT4Nb4eIrZUBCcnL-Nskym6mIY1lFBMGNFYgvumO9pjJAboM6FYZz6CEAgdQ/exec';

// Fires a report to the Apps Script endpoint. Uses mode:'no-cors' since
// Apps Script Web Apps don't support CORS preflight requests from another
// origin — this means we can't read the response, so success is assumed
// once the request is sent rather than confirmed. text/plain content-type
// is used deliberately (not application/json) to avoid triggering a
// preflight OPTIONS request, which Apps Script Web Apps can't handle.
function reportQuestion(payload){
  if(!REPORT_ENDPOINT_URL) return Promise.resolve(false);
  return fetch(REPORT_ENDPOINT_URL,{
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload),
  }).then(()=>true).catch(()=>false);
}

// main render()/state machine, so it can't interfere with in-progress quiz
// state (answers, timer, section navigation). It manages its own lifecycle

  const box=el('div',{css:'background:#fff;border-radius:16px;padding:22px;border:1px solid #e2e8f0;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,0.25);'});
  box.appendChild(el('div',{css:'font-family:Syne,sans-serif;font-weight:700;font-size:17px;margin-bottom:4px;color:#0f172a;',text:'🚩 Report this question'}));
  box.appendChild(el('div',{css:'font-size:12px;color:#64748b;margin-bottom:14px;line-height:1.5;',text:'This goes straight to the question bank for review — thank you for helping improve it.'}));

  const select=el('select',{css:'width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;margin-bottom:10px;'});
  REPORT_REASONS.forEach(r=>select.appendChild(el('option',{value:r,text:r})));

  const note=el('textarea',{css:'width:100%;padding:10px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;min-height:70px;margin-bottom:14px;font-family:inherit;resize:vertical;'});
  note.placeholder='Optional — any extra detail';

  const statusMsg=el('div',{css:'font-size:12px;color:#059669;margin-bottom:8px;display:none;',text:'✓ Reported — thank you!'});
  box.appendChild(select);
  box.appendChild(note);
  box.appendChild(statusMsg);

  const btnRow=el('div',{css:'display:flex;gap:10px;'});
  const cancelBtn=el('button',{css:'flex:1;padding:11px;background:#f1f5f9;border:1px solid #e2e8f0;color:#0f172a;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;',text:'Cancel',onClick:()=>ov.remove()});
  const submitBtn=el('button',{css:'flex:1;padding:11px;background:#b91c1c;border:none;color:#fff;border-radius:9px;cursor:pointer;font-family:Syne,sans-serif;font-weight:700;font-size:13px;',text:'Submit Report',onClick:()=>{
    submitBtn.disabled=true; submitBtn.textContent='Sending…';
    const reason = select.value + (note.value.trim() ? (' — '+note.value.trim()) : '');
    reportQuestion({
      examTags: S.activeExamKey || '',
      setId: (S.test && S.test.id) || '',
      sheetId: q.sheetId || '',
      subject: q.subject || '',
      question: q.q || '',
      reason: reason,
    }).finally(()=>{
      statusMsg.style.display='block';
      cancelBtn.textContent='Close';
      submitBtn.remove();
      setTimeout(()=>ov.remove(),1400);
    });
  }});
  btnRow.appendChild(cancelBtn);
  btnRow.appendChild(submitBtn);
  box.appendChild(btnRow);

  ov.appendChild(box);
  ov.addEventListener('click',(e)=>{ if(e.target===ov) ov.remove(); });
  document.body.appendChild(ov);
}

function examUrl(catKey, examKey){
  return '/' + catKey.replace(/_/g,'-') + '/' + examKey.replace(/_/g,'-');
}
function parseUrlPath(){
  const parts = location.pathname.split('/').filter(Boolean);
  if(parts.length < 2) return null;
  const catSlug = parts[0], examSlug = parts[1];
  for(const [catKey, cat] of Object.entries(DATA)){
    if(catKey.replace(/_/g,'-') !== catSlug) continue;
    for(const [examKey, exam] of Object.entries(cat.exams)){
      if(examKey.replace(/_/g,'-') === examSlug){
        return { catKey, examKey, exam };
      }
    }
  }
  return null;
}
function navigateToExam(catKey, examKey, exam){
  const url = examUrl(catKey, examKey);
  if(location.pathname !== url) history.pushState({catKey,examKey}, '', url);
  document.title = exam.name + ' Free Mock Test | MockAdda';
  const metaDesc = document.querySelector('meta[name="description"]');
  if(metaDesc) metaDesc.setAttribute('content',
    'Practice free ' + exam.fullname + ' (' + exam.name + ') mock tests on MockAdda. Timed, exam-pattern questions with instant results.');
}

function getWordOfDay(){
  const now = new Date();
  const start = new Date(now.getFullYear(),0,0);
  const diff = now - start;
  const dayOfYear = Math.floor(diff / 86400000);
  return VOCAB_WORDS[dayOfYear % VOCAB_WORDS.length];
}

  en: [
    { id:'en1', level:'Beginner', title:'Daily Practice',
      text:"Success comes to those who work hard every single day. A student who practices typing for even ten minutes daily will see steady improvement within a few weeks. Speed matters, but accuracy matters more. Focus on typing every word correctly before trying to type faster. Many beginners make the mistake of watching their fingers instead of the screen, which slows them down and breaks their rhythm. Instead, try to memorize the position of each key so that your fingers move automatically while your eyes stay fixed on the passage. Over time, this habit becomes second nature, and what once felt slow and difficult will start to feel effortless. Remember that every expert typist was once a beginner who simply refused to give up after a few days of slow progress. Consistency, patience and daily repetition are the real secrets behind a fast and accurate typing speed." },
    { id:'en2', level:'Beginner', title:'Simple Habits',
      text:"Good habits build a good future. Waking up early, reading for a few minutes, and reviewing notes at the end of the day are small steps. None of these steps feel big on their own, but together they create real progress over months and years of steady effort. A person who plans their day the night before usually wastes less time deciding what to do next and can focus entirely on completing each task. Drinking enough water, taking short breaks between long study sessions, and sleeping for at least seven hours each night also play an important role in keeping the mind sharp and alert. Small, boring habits repeated every single day almost always outperform occasional bursts of motivation. If you want to see a real change in your preparation, results, or health, start by changing one small habit this week and stay consistent with it, no matter how unimportant it may seem at first." },
    { id:'en3', level:'Beginner', title:'Nature & Environment',
      text:"Trees give us clean air to breathe and shade to rest under. Rivers carry water to fields, cities and villages alike. When forests are cut down carelessly, animals lose their homes and rainfall patterns change. Every small step, like planting a tree or saving water, helps protect the environment for future generations. Plastic waste thrown into rivers and oceans harms fish, birds and other marine creatures that mistake it for food. Factories that release smoke and chemicals into the air without proper filters contribute heavily to pollution in nearby towns and villages. Governments across the world are now encouraging the use of solar energy, electric vehicles and recycling programs to slow down the damage already done to the planet. Ordinary citizens can also contribute by using cloth bags instead of plastic, switching off unused lights and fans, and planting at least one tree every year near their home or school." },
    { id:'en4', level:'Beginner', title:'Games and Sports',
      text:"Playing outdoor games every day keeps the body healthy and the mind fresh. Cricket, kabaddi, football and badminton are popular sports played across India. Regular practice builds not only physical strength but also teamwork, discipline and patience. Many young athletes train for years before representing their state or country at a national level. Coaches often say that natural talent alone is never enough to succeed at the highest level of any sport; it must be combined with regular practice, a disciplined diet, and the mental strength to recover quickly after a loss. Schools and colleges that encourage sports alongside academics usually produce more confident and well-rounded students. Watching a match teaches patience and strategy, but actually playing a sport teaches something deeper — how to handle both victory and defeat gracefully, and how to keep trying even when the odds are against you." },
    { id:'en5', level:'Beginner', title:'Festivals of India',
      text:"India celebrates festivals throughout the year, each carrying its own story and tradition. Diwali brings lights and sweets, Holi fills the air with colour, and Eid brings families together for feasts. These celebrations reflect the diversity of Indian culture and remind everyone of the importance of togetherness, gratitude and joy. Durga Puja in the east, Onam in the south, and Baisakhi in the north each carry regional customs that have been passed down through generations. Markets are decorated with lights, sweets shops stay open late into the night, and families travel long distances just to celebrate together once a year. Beyond the celebrations themselves, these festivals also boost local economies, as artisans, farmers and small shopkeepers see a rise in sales during the festive season. For many people, festivals are less about religion and more about pausing daily routines to reconnect with family, friends and community." },
    { id:'en6', level:'Intermediate', title:'Exam Preparation',
      text:"Government job exams in India test a wide range of skills, from general knowledge to reasoning and quantitative aptitude. Many posts, especially Data Entry Operator roles, also require a typing speed test as part of the selection process. Building typing speed alongside subject knowledge gives candidates a real advantage during the final stages of recruitment. Most exam bodies set a minimum qualifying speed, often between twenty five and thirty five words per minute, along with a maximum permissible error rate, so accuracy is just as important as raw speed. Candidates who only focus on subject preparation and ignore the typing test often lose out at the final stage despite scoring well in the written exam. A structured practice routine — starting with slow, error-free typing and gradually increasing speed over several weeks — tends to produce far better results than last-minute cramming a few days before the actual test." },
    { id:'en7', level:'Intermediate', title:'Time Management',
      text:"Time management is often the difference between candidates who clear an exam and those who do not. Dividing the syllabus into weekly targets, revising older topics regularly, and taking timed mock tests helps students understand exactly where they stand before the real exam day arrives. Many aspirants spend excessive time on subjects they already find comfortable while completely avoiding weaker areas, which creates a false sense of confidence that collapses on exam day. A better approach is to allocate slightly more time to weaker subjects while still maintaining a light touch on stronger ones through periodic revision. Keeping a simple daily log of hours studied, topics covered and mock test scores can reveal patterns that are otherwise easy to miss, allowing a candidate to adjust their strategy well before it is too late." },
    { id:'en8', level:'Intermediate', title:'Computers and Technology',
      text:"A computer processes information using hardware components like the processor, memory and storage, along with software that instructs it what to do. The internet connects millions of computers worldwide, allowing instant communication and access to information. Basic computer literacy, including typing skills, file management and internet safety, is now essential for almost every government and private sector job. Understanding how to organize files into folders, use spreadsheets for simple calculations, and recognize phishing emails or suspicious links has become as important as knowing how to read and write. Government offices across India are steadily moving towards paperless systems, where records, applications and payments are all processed digitally rather than on paper. This shift means that a Data Entry Operator or clerical staff member today needs not just fast and accurate typing but also a working understanding of spreadsheets, basic troubleshooting and safe internet practices." },
    { id:'en9', level:'Intermediate', title:'Indian Geography',
      text:"India is bordered by the Himalayas in the north, the Arabian Sea in the west, the Bay of Bengal in the east, and the Indian Ocean in the south. The country is divided into twenty eight states and eight union territories, each with its own language, climate and geography. Major rivers like the Ganga, Yamuna, Godavari and Brahmaputra support agriculture and provide drinking water to millions of people. The Thar Desert in the west receives scanty rainfall, while the Western Ghats and the northeastern states receive some of the heaviest rainfall in the entire country. This variation in climate and terrain has shaped everything from local crops and diets to architecture and clothing across different regions. Competitive exams frequently test candidates on state capitals, major rivers, mountain ranges and important dams, making a strong grasp of physical and political geography essential for scoring well in the general awareness section." },
    { id:'en10', level:'Intermediate', title:'Banking and Economy',
      text:"Banks accept deposits from the public and lend money to individuals and businesses, earning interest on loans while paying a smaller interest to depositors. The Reserve Bank of India regulates all banks and controls the money supply through tools like the repo rate. A strong banking system is essential for economic growth, as it channels savings into productive investments across agriculture, industry and services. When the RBI raises the repo rate, borrowing becomes more expensive, which typically slows down spending and helps control inflation; lowering the rate has the opposite effect, encouraging businesses and individuals to borrow and spend more freely. Public sector banks, private banks, cooperative banks and regional rural banks together form a vast network that reaches even the most remote villages through initiatives like the Pradhan Mantri Jan Dhan Yojana, which has brought millions of previously unbanked citizens into the formal financial system for the first time." },
    { id:'en11', level:'Advanced', title:'Discipline and Consistency',
      text:"Consistency beats intensity when it comes to long term preparation. A candidate who studies for two focused hours every day for six months will almost always outperform someone who studies for twelve hours occasionally and then takes long breaks. The same principle applies to typing practice. Short, regular sessions build muscle memory far more effectively than infrequent, lengthy ones. Set a realistic daily target, track your words per minute and accuracy over time, and celebrate small improvements along the way. It is also worth remembering that plateaus are a normal part of skill-building; a typist who has been stuck at the same speed for two weeks has not necessarily stopped improving — the underlying muscle memory is often still strengthening beneath the surface, and a breakthrough frequently follows shortly after a period that felt stagnant. Avoiding frustration during these plateaus, and simply continuing the daily routine without giving up, is often what separates those who eventually reach high speeds from those who quit just before the improvement would have shown up." },
    { id:'en12', level:'Advanced', title:'General Awareness Matters',
      text:"Current affairs and general awareness sections often decide the final rank in competitive exams, precisely because they are the sections most candidates neglect. Reading a newspaper daily, noting down important schemes, appointments, and dates, and revising them weekly is far more effective than trying to memorize months of news the night before an exam. Numbers like 42.5%, budgets worth Rs. 12,000 crore, or dates such as 15/08/1947 also test how comfortable a candidate is typing digits and punctuation accurately under time pressure. Building a habit of maintaining a monthly current affairs notebook, summarizing each important event in two or three lines rather than copying entire articles, helps enormously during quick revision before the exam. Government scheme names, their launch dates, the ministries responsible for them, and their stated objectives are among the most frequently repeated question types across almost every competitive exam conducted in India, from SSC and Banking to Railways and state-level recruitment boards." },
    { id:'en13', level:'Advanced', title:'Legal & Constitutional Terminology',
      text:"The Constitution of India, adopted on 26th November 1949 and enforced from 26th January 1950, is the supreme law of the land. It guarantees Fundamental Rights under Articles 12 to 35, including the Right to Equality, Right to Freedom and Right to Constitutional Remedies. Any law found inconsistent with these provisions can be declared void by the judiciary under Article 13(2), ensuring that the rule of law prevails over arbitrary action. The Directive Principles of State Policy, contained in Part IV of the Constitution, guide the government in framing laws and policies for the welfare of its citizens, even though these principles are not enforceable in a court of law the way Fundamental Rights are. Amendments to the Constitution, governed by Article 368, require varying degrees of approval depending on the provision being changed — some need a simple majority, others a special majority, and certain federal provisions additionally require ratification by at least half of the state legislatures before they can take effect." },
    { id:'en14', level:'Advanced', title:'Medical & Healthcare Terminology',
      text:"The human circulatory system consists of the heart, blood vessels and blood, working together to transport oxygen, nutrients and hormones throughout the body. The heart, a muscular organ roughly the size of a fist, pumps approximately 5 litres of blood per minute through arteries, veins and capillaries. Regular check-ups, a balanced diet low in saturated fat, and at least 30 minutes of daily exercise significantly reduce the risk of cardiovascular disease. Hypertension, often called the silent killer because it typically shows no symptoms until serious damage has already occurred, remains one of the leading risk factors for heart attacks and strokes worldwide. Public health campaigns increasingly emphasize preventive care — regular blood pressure monitoring, reduced salt intake, and early screening for diabetes — over expensive treatment after a medical crisis has already developed. Understanding basic medical terminology such as systolic and diastolic pressure, cholesterol levels, and body mass index has become genuinely useful general knowledge for citizens navigating an increasingly health-conscious society." },
    { id:'en15', level:'Advanced', title:'Government Office Circular',
      text:"All employees are hereby informed that, with effect from 1st April 2026, office attendance will be recorded exclusively through the biometric system installed at the main entrance. Employees arriving after 9:45 a.m. without prior written approval from their Reporting Officer shall be marked as late, and three such instances in a calendar month may attract disciplinary action under Rule 12(3) of the Service Conduct Regulations. Compliance is mandatory for all staff, irrespective of designation. Any employee facing genuine hardship, such as a medical emergency or an unavoidable family obligation, must submit a written explanation along with supporting documents to the Administrative Officer within 48 hours of the occurrence, failing which the absence will be treated as unauthorized leave. Departments are also required to submit a consolidated monthly attendance report to the Head Office by the 5th of the following month, and any discrepancy between the biometric record and the manual register must be reconciled and explained in writing before the report is finalized and forwarded for approval." }

  hi: [
    { id:'hi1', level:'Beginner', title:'रोज़ अभ्यास',
      text:"मेहनत करने वालों की कभी हार नहीं होती। जो विद्यार्थी हर दिन दस मिनट भी टाइपिंग का अभ्यास करता है, वह कुछ ही सप्ताह में सुधार देखता है। गति महत्वपूर्ण है, लेकिन सटीकता उससे भी अधिक महत्वपूर्ण है। तेज़ टाइप करने से पहले हर शब्द को सही ढंग से टाइप करने पर ध्यान दें। अधिकतर शुरुआती लोग अपनी उंगलियों को देखने की गलती करते हैं, न कि स्क्रीन को, जिससे उनकी गति धीमी हो जाती है और लय टूट जाती है। इसके बजाय, हर बटन की स्थिति को याद रखने की कोशिश करें ताकि आपकी उंगलियाँ अपने आप चलें और आपकी आंखें पैसेज पर टिकी रहें। समय के साथ यह आदत स्वाभाविक हो जाती है, और जो पहले धीमा और कठिन लगता था, वह सहज महसूस होने लगता है। याद रखें कि हर विशेषज्ञ टाइपिस्ट कभी शुरुआती था, जिसने बस शुरुआती धीमी प्रगति के बाद हार नहीं मानी।" },
    { id:'hi2', level:'Beginner', title:'अच्छी आदतें',
      text:"अच्छी आदतें एक अच्छे भविष्य का निर्माण करती हैं। जल्दी उठना, कुछ मिनट पढ़ना, और दिन के अंत में नोट्स की समीक्षा करना छोटे कदम हैं। ये सभी कदम अकेले बड़े नहीं लगते, लेकिन महीनों और वर्षों के निरंतर प्रयास से मिलकर ये वास्तविक प्रगति बनाते हैं। जो व्यक्ति अपने दिन की योजना पिछली रात बना लेता है, वह आमतौर पर अगले कदम को तय करने में कम समय बर्बाद करता है और हर काम को पूरा करने पर पूरी तरह ध्यान दे पाता है। पर्याप्त पानी पीना, लंबे अध्ययन सत्रों के बीच छोटे विराम लेना, और हर रात कम से कम सात घंटे सोना भी दिमाग को तेज़ और सतर्क बनाए रखने में महत्वपूर्ण भूमिका निभाते हैं। छोटी, उबाऊ आदतें जो हर दिन दोहराई जाती हैं, वे लगभग हमेशा कभी-कभार की प्रेरणा से बेहतर परिणाम देती हैं।" },
    { id:'hi3', level:'Beginner', title:'प्रकृति और पर्यावरण',
      text:"पेड़ हमें सांस लेने के लिए स्वच्छ हवा और आराम करने के लिए छाया देते हैं। नदियाँ खेतों, शहरों और गांवों तक पानी पहुंचाती हैं। जब जंगलों को लापरवाही से काटा जाता है, तो जानवर अपना घर खो देते हैं और वर्षा का पैटर्न बदल जाता है। एक पेड़ लगाने या पानी बचाने जैसा हर छोटा कदम आने वाली पीढ़ियों के लिए पर्यावरण की रक्षा करने में मदद करता है। नदियों और समुद्रों में फेंका गया प्लास्टिक कचरा मछलियों, पक्षियों और अन्य समुद्री जीवों को नुकसान पहुंचाता है, जो इसे भोजन समझकर निगल लेते हैं। बिना उचित फिल्टर के धुआं और रसायन हवा में छोड़ने वाले कारखाने पास के शहरों और गांवों में प्रदूषण में भारी योगदान देते हैं। दुनिया भर की सरकारें अब सौर ऊर्जा, इलेक्ट्रिक वाहनों और पुनर्चक्रण कार्यक्रमों को बढ़ावा दे रही हैं ताकि ग्रह को पहले से हो चुके नुकसान की गति धीमी की जा सके।" },
    { id:'hi4', level:'Beginner', title:'खेल-कूद',
      text:"हर दिन बाहरी खेल खेलने से शरीर स्वस्थ और मन तरोताज़ा रहता है। क्रिकेट, कबड्डी, फुटबॉल और बैडमिंटन पूरे भारत में लोकप्रिय खेल हैं। नियमित अभ्यास न केवल शारीरिक शक्ति बल्कि टीम भावना, अनुशासन और धैर्य भी विकसित करता है। कई युवा खिलाड़ी राष्ट्रीय स्तर पर अपने राज्य या देश का प्रतिनिधित्व करने से पहले वर्षों तक अभ्यास करते हैं। कोच अक्सर कहते हैं कि अकेली प्राकृतिक प्रतिभा किसी भी खेल में उच्चतम स्तर पर सफल होने के लिए कभी पर्याप्त नहीं होती; इसे नियमित अभ्यास, अनुशासित आहार, और हार के बाद जल्दी उबरने की मानसिक शक्ति के साथ जोड़ा जाना चाहिए। खेल को प्रोत्साहित करने वाले स्कूल और कॉलेज आमतौर पर अधिक आत्मविश्वासी और संतुलित विद्यार्थी तैयार करते हैं।" },
    { id:'hi5', level:'Beginner', title:'भारत के त्योहार',
      text:"भारत पूरे वर्ष त्योहार मनाता है, जिनमें से प्रत्येक की अपनी कहानी और परंपरा है। दिवाली रोशनी और मिठाइयाँ लाती है, होली हवा को रंगों से भर देती है, और ईद परिवारों को दावत के लिए एक साथ लाती है। ये उत्सव भारतीय संस्कृति की विविधता को दर्शाते हैं और सभी को एकजुटता, कृतज्ञता और खुशी के महत्व की याद दिलाते हैं। पूर्व में दुर्गा पूजा, दक्षिण में ओणम, और उत्तर में बैसाखी, प्रत्येक में क्षेत्रीय रीति-रिवाज हैं जो पीढ़ियों से चले आ रहे हैं। बाज़ार रोशनी से सजते हैं, मिठाई की दुकानें देर रात तक खुली रहती हैं, और परिवार साल में एक बार साथ मिलकर उत्सव मनाने के लिए लंबी दूरी तय करते हैं। उत्सवों के अलावा, ये त्योहार स्थानीय अर्थव्यवस्था को भी बढ़ावा देते हैं, क्योंकि त्योहारी सीज़न में कारीगरों, किसानों और छोटे दुकानदारों की बिक्री बढ़ जाती है।" },
    { id:'hi6', level:'Intermediate', title:'परीक्षा की तैयारी',
      text:"भारत में सरकारी नौकरी की परीक्षाएं सामान्य ज्ञान से लेकर तर्कशक्ति और गणितीय योग्यता तक कई कौशलों की परीक्षा लेती हैं। कई पदों के लिए, विशेष रूप से डेटा एंट्री ऑपरेटर की भूमिकाओं के लिए, चयन प्रक्रिया के भाग के रूप में टाइपिंग गति परीक्षण भी आवश्यक होता है। विषय ज्ञान के साथ टाइपिंग गति बढ़ाना उम्मीदवारों को भर्ती के अंतिम चरणों में वास्तविक बढ़त देता है। अधिकतर परीक्षा संस्थाएं न्यूनतम उत्तीर्ण गति तय करती हैं, अक्सर पच्चीस से पैंतीस शब्द प्रति मिनट के बीच, साथ ही अधिकतम अनुमेय त्रुटि दर भी, इसलिए सटीकता उतनी ही महत्वपूर्ण है जितनी कच्ची गति। जो उम्मीदवार केवल विषय की तैयारी पर ध्यान देते हैं और टाइपिंग परीक्षण को नज़रअंदाज़ करते हैं, वे अक्सर लिखित परीक्षा में अच्छे अंक लाने के बावजूद अंतिम चरण में पिछड़ जाते हैं।" },
    { id:'hi7', level:'Intermediate', title:'समय प्रबंधन',
      text:"समय प्रबंधन अक्सर उन उम्मीदवारों के बीच अंतर पैदा करता है जो परीक्षा पास करते हैं और जो नहीं करते। पाठ्यक्रम को साप्ताहिक लक्ष्यों में विभाजित करना, पुराने विषयों को नियमित रूप से दोहराना, और समयबद्ध मॉक टेस्ट देना विद्यार्थियों को यह समझने में मदद करता है कि वास्तविक परीक्षा के दिन से पहले वे कहाँ खड़े हैं। कई उम्मीदवार उन विषयों पर अत्यधिक समय बिताते हैं जिनमें वे पहले से सहज हैं, जबकि कमज़ोर क्षेत्रों को पूरी तरह टाल देते हैं, जिससे एक झूठा आत्मविश्वास पैदा होता है जो परीक्षा के दिन ढह जाता है। एक बेहतर तरीका यह है कि कमज़ोर विषयों को थोड़ा अधिक समय दिया जाए जबकि मज़बूत विषयों पर आवधिक पुनरावृत्ति के माध्यम से हल्का ध्यान बनाए रखा जाए। पढ़े गए घंटों, कवर किए गए विषयों और मॉक टेस्ट स्कोर का एक सरल दैनिक रिकॉर्ड रखना उन पैटर्न को उजागर कर सकता है जो अन्यथा नज़रअंदाज़ हो जाते हैं।" },
    { id:'hi8', level:'Intermediate', title:'कंप्यूटर और तकनीक',
      text:"एक कंप्यूटर प्रोसेसर, मेमोरी और स्टोरेज जैसे हार्डवेयर घटकों का उपयोग करके जानकारी को संसाधित करता है, साथ ही सॉफ्टवेयर के साथ जो उसे बताता है कि क्या करना है। इंटरनेट दुनिया भर में लाखों कंप्यूटरों को जोड़ता है, जिससे त्वरित संचार और जानकारी तक पहुंच संभव होती है। टाइपिंग कौशल, फाइल प्रबंधन और इंटरनेट सुरक्षा सहित बुनियादी कंप्यूटर साक्षरता अब लगभग हर सरकारी और निजी क्षेत्र की नौकरी के लिए आवश्यक है। फाइलों को फोल्डरों में व्यवस्थित करना, सरल गणनाओं के लिए स्प्रेडशीट का उपयोग करना, और फ़िशिंग ईमेल या संदिग्ध लिंक को पहचानना अब पढ़ना-लिखना जानने जितना ही महत्वपूर्ण हो गया है। भारत भर के सरकारी कार्यालय धीरे-धीरे कागज़ रहित प्रणालियों की ओर बढ़ रहे हैं, जहाँ रिकॉर्ड, आवेदन और भुगतान सभी कागज़ के बजाय डिजिटल रूप से संसाधित किए जाते हैं।" },
    { id:'hi9', level:'Intermediate', title:'भारतीय भूगोल',
      text:"भारत उत्तर में हिमालय, पश्चिम में अरब सागर, पूर्व में बंगाल की खाड़ी और दक्षिण में हिंद महासागर से घिरा है। देश को अट्ठाईस राज्यों और आठ केंद्र शासित प्रदेशों में विभाजित किया गया है, जिनमें से प्रत्येक की अपनी भाषा, जलवायु और भूगोल है। गंगा, यमुना, गोदावरी और ब्रह्मपुत्र जैसी प्रमुख नदियाँ कृषि का समर्थन करती हैं और लाखों लोगों को पीने का पानी प्रदान करती हैं। पश्चिम में थार रेगिस्तान में बहुत कम वर्षा होती है, जबकि पश्चिमी घाट और पूर्वोत्तर राज्यों में पूरे देश में सबसे भारी वर्षा होती है। जलवायु और भूभाग की इस विविधता ने स्थानीय फसलों और आहार से लेकर वास्तुकला और वस्त्रों तक, विभिन्न क्षेत्रों में हर चीज़ को आकार दिया है। प्रतियोगी परीक्षाएं अक्सर उम्मीदवारों से राज्यों की राजधानियों, प्रमुख नदियों, पर्वत श्रृंखलाओं और महत्वपूर्ण बांधों के बारे में पूछती हैं।" },
    { id:'hi10', level:'Intermediate', title:'बैंकिंग और अर्थव्यवस्था',
      text:"बैंक जनता से जमा स्वीकार करते हैं और व्यक्तियों तथा व्यवसायों को धन उधार देते हैं, ऋणों पर ब्याज कमाते हैं जबकि जमाकर्ताओं को कम ब्याज देते हैं। भारतीय रिज़र्व बैंक सभी बैंकों को नियंत्रित करता है और रेपो दर जैसे उपकरणों के माध्यम से मुद्रा आपूर्ति को नियंत्रित करता है। आर्थिक विकास के लिए एक मजबूत बैंकिंग प्रणाली आवश्यक है, क्योंकि यह बचत को कृषि, उद्योग और सेवाओं में उत्पादक निवेश में बदल देती है। जब आरबीआई रेपो दर बढ़ाता है, तो उधार लेना महंगा हो जाता है, जो आमतौर पर खर्च को धीमा करता है और मुद्रास्फीति को नियंत्रित करने में मदद करता है; दर घटाने का प्रभाव इसके विपरीत होता है। सार्वजनिक क्षेत्र के बैंक, निजी बैंक, सहकारी बैंक और क्षेत्रीय ग्रामीण बैंक मिलकर एक विशाल नेटवर्क बनाते हैं जो प्रधानमंत्री जन धन योजना जैसी पहलों के माध्यम से सबसे दूरदराज़ के गांवों तक भी पहुंचता है।" },
    { id:'hi11', level:'Advanced', title:'अनुशासन और निरंतरता',
      text:"लंबी अवधि की तैयारी में निरंतरता तीव्रता से अधिक महत्वपूर्ण होती है। जो उम्मीदवार छह महीने तक हर दिन दो घंटे केंद्रित होकर पढ़ता है, वह उस व्यक्ति से हमेशा बेहतर प्रदर्शन करेगा जो कभी-कभी बारह घंटे पढ़ता है और फिर लंबा अवकाश लेता है। यही सिद्धांत टाइपिंग अभ्यास पर भी लागू होता है। छोटे, नियमित सत्र अनियमित और लंबे सत्रों की तुलना में मांसपेशियों की स्मृति को कहीं अधिक प्रभावी ढंग से बनाते हैं। यह याद रखने योग्य भी है कि पठार कौशल-निर्माण का एक सामान्य हिस्सा हैं; जो टाइपिस्ट दो सप्ताह से एक ही गति पर अटका हुआ है, उसने ज़रूरी नहीं कि सुधार करना बंद कर दिया हो — अंतर्निहित मांसपेशी स्मृति अक्सर सतह के नीचे मज़बूत होती रहती है, और एक सफलता अक्सर उस अवधि के तुरंत बाद आती है जो स्थिर महसूस हुई थी।" },
    { id:'hi12', level:'Advanced', title:'सामान्य ज्ञान का महत्व',
      text:"प्रतियोगी परीक्षाओं में करेंट अफेयर्स और सामान्य ज्ञान खंड अक्सर अंतिम रैंक तय करते हैं, ठीक इसलिए क्योंकि यही वे खंड हैं जिन्हें अधिकतर उम्मीदवार नज़रअंदाज़ करते हैं। रोज़ अखबार पढ़ना, महत्वपूर्ण योजनाओं, नियुक्तियों और तारीखों को नोट करना, और साप्ताहिक रूप से उन्हें दोहराना परीक्षा से एक रात पहले महीनों की खबरें याद करने की कोशिश से कहीं अधिक प्रभावी है। 42.5% जैसी संख्याएँ, 12,000 करोड़ रुपये का बजट, या 15/08/1947 जैसी तारीखें यह भी परखती हैं कि उम्मीदवार समय के दबाव में अंकों और विराम चिह्नों को कितनी सटीकता से टाइप कर पाता है। हर महीने एक करेंट अफेयर्स नोटबुक बनाए रखने की आदत डालना, हर महत्वपूर्ण घटना को दो या तीन पंक्तियों में सारांशित करना न कि पूरे लेख की नकल करना, परीक्षा से पहले त्वरित पुनरावृत्ति के दौरान बेहद मददगार साबित होता है।" },
    { id:'hi13', level:'Advanced', title:'विधिक एवं संवैधानिक शब्दावली',
      text:"26 नवंबर 1949 को अपनाया गया और 26 जनवरी 1950 से लागू भारत का संविधान, देश का सर्वोच्च कानून है। यह अनुच्छेद 12 से 35 के तहत मौलिक अधिकारों की गारंटी देता है, जिसमें समानता का अधिकार, स्वतंत्रता का अधिकार और संवैधानिक उपचारों का अधिकार शामिल है। इन प्रावधानों के साथ असंगत पाया गया कोई भी कानून अनुच्छेद 13(2) के तहत न्यायपालिका द्वारा शून्य घोषित किया जा सकता है, जिससे यह सुनिश्चित होता है कि मनमानी कार्रवाई पर कानून का शासन प्रबल हो। संविधान के भाग IV में निहित राज्य के नीति निदेशक तत्व, नागरिकों के कल्याण के लिए कानून और नीतियां बनाने में सरकार का मार्गदर्शन करते हैं, भले ही ये सिद्धांत मौलिक अधिकारों की तरह न्यायालय में लागू करने योग्य न हों। अनुच्छेद 368 द्वारा शासित संविधान में संशोधन, बदले जा रहे प्रावधान के आधार पर अलग-अलग स्तर की स्वीकृति की आवश्यकता होती है।" },
    { id:'hi14', level:'Advanced', title:'चिकित्सा एवं स्वास्थ्य शब्दावली',
      text:"मानव परिसंचरण तंत्र में हृदय, रक्त वाहिकाएँ और रक्त शामिल हैं, जो मिलकर पूरे शरीर में ऑक्सीजन, पोषक तत्वों और हार्मोन को पहुंचाने का कार्य करते हैं। हृदय, जो लगभग मुट्ठी के आकार का एक मांसपेशीय अंग है, धमनियों, शिराओं और केशिकाओं के माध्यम से प्रति मिनट लगभग 5 लीटर रक्त पंप करता है। नियमित जांच, संतृप्त वसा में कम संतुलित आहार, और प्रतिदिन कम से कम 30 मिनट का व्यायाम हृदय रोग के जोखिम को काफी हद तक कम करता है। उच्च रक्तचाप, जिसे अक्सर मूक हत्यारा कहा जाता है क्योंकि यह आमतौर पर गंभीर क्षति होने तक कोई लक्षण नहीं दिखाता, दुनिया भर में दिल के दौरे और स्ट्रोक के प्रमुख जोखिम कारकों में से एक बना हुआ है। सार्वजनिक स्वास्थ्य अभियान अब निवारक देखभाल पर अधिक ज़ोर देते हैं — नियमित रक्तचाप निगरानी, कम नमक का सेवन, और मधुमेह की प्रारंभिक जांच — बजाय इसके कि चिकित्सा संकट विकसित होने के बाद महंगे इलाज पर निर्भर रहा जाए।" },
    { id:'hi15', level:'Advanced', title:'सरकारी कार्यालय परिपत्र',

function el(tag,props={},children=[]){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(props)){
    if(k==='style') Object.assign(e.style,v);
    else if(k==='css') e.style.cssText=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='html') e.innerHTML=v;
    else if(k==='text') e.textContent=v;
    else e.setAttribute(k,v);
  }
  children.filter(Boolean).forEach(c=>e.appendChild(typeof c==='string'?document.createTextNode(c):c));
  return e;
}
const render=()=>{
  // CRITICAL ORDERING: the language toggle may currently be living INSIDE
  // #app (moved into the quiz top bar's #langFloatSlot by a previous
  // render). If we ran app.innerHTML='' while it's still in there, that
  // wipes the toggle out of the DOM permanently — it would never come back
  // without a full page reload. So we always pull it back out to <body>
  // first, THEN clear and rebuild #app, THEN re-attach it into the new
  // screen's slot if one exists.
  const lf=document.getElementById('langFloat');
  if(lf && lf.parentElement!==document.body){
    document.body.appendChild(lf);
    lf.classList.remove('inline');
  }
  app.innerHTML='';
  app.appendChild(buildScreen());
  document.body.setAttribute('data-screen',S.screen);
  // Move the language toggle into the quiz top bar's slot when one exists
  // (quiz screen), otherwise it stays as the floating top-right pill.
  // This is what keeps it from ever covering Save & Next / the palette sheet.
  const slot=document.getElementById('langFloatSlot');
  if(lf && slot){ slot.appendChild(lf); lf.classList.add('inline'); }
  window.scrollTo(0,0);
};
const go=screen=>{S.screen=screen;render();};

// Darkens (negative percent) or lightens (positive percent) a hex color, e.g. shadeColor('#3b82f6', -20)
function shadeColor(hex, percent){
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  r=Math.round(Math.min(255,Math.max(0,r+(percent/100)*255)));
  g=Math.round(Math.min(255,Math.max(0,g+(percent/100)*255)));
  b=Math.round(Math.min(255,Math.max(0,b+(percent/100)*255)));
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

const MISTAKES_KEY = 'mockadda_mistakes_v1';
function loadMistakes(){
  try{ return JSON.parse(localStorage.getItem(MISTAKES_KEY) || '[]'); }catch(e){ return []; }
}
function saveMistakesList(list){
  try{ localStorage.setItem(MISTAKES_KEY, JSON.stringify(list)); }catch(e){ /* storage unavailable — fail silently */ }
}
function isMistakeSaved(qText){
  return loadMistakes().some(m=>m.q===qText);
}
function toggleMistake(q){
  const list = loadMistakes();
  const idx = list.findIndex(m=>m.q===q.q);
  if(idx>-1){ list.splice(idx,1); } else { list.push({...q, savedAt:Date.now()}); }
  saveMistakesList(list);
}

// ── STUDY STREAK TRACKER (saved on this device via localStorage) ─────────────
const STREAK_KEY = 'mockadda_streak_v1';
function todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function loadStreak(){
  try{ return JSON.parse(localStorage.getItem(STREAK_KEY)) || {lastActiveDate:null, currentStreak:0, longestStreak:0, totalSessions:0}; }
  catch(e){ return {lastActiveDate:null, currentStreak:0, longestStreak:0, totalSessions:0}; }
}
function recordActivity(){
  const s = loadStreak();
  const today = todayStr();
  if(s.lastActiveDate===today){ s.totalSessions++; }
  else {
    const yesterday = new Date(Date.now()-86400000);
    const yStr = yesterday.getFullYear()+'-'+String(yesterday.getMonth()+1).padStart(2,'0')+'-'+String(yesterday.getDate()).padStart(2,'0');
    s.currentStreak = (s.lastActiveDate===yStr) ? s.currentStreak+1 : 1;
    s.longestStreak = Math.max(s.longestStreak, s.currentStreak);
    s.lastActiveDate = today;
    s.totalSessions = (s.totalSessions||0)+1;
  }
  try{ localStorage.setItem(STREAK_KEY, JSON.stringify(s)); }catch(e){}
  return s;
}

// Groups a test's questions by subject, in first-seen order. Returns null if the
// test has no subject data at all, or only one subject (tabs aren't useful with just one).
function getSubjectSections(test){
  const hasSubjects = test.questions.some(q=>q.subject);
  if(!hasSubjects) return null;
  const order=[], map={};
  test.questions.forEach((q,i)=>{
    const subj = (q.subject || 'General').trim();
    if(!map[subj]){ map[subj]=[]; order.push(subj); }
    map[subj].push(i);
  });
  const sections = order.map(subj=>({subject:subj, indices:map[subj]}));
  return sections.length>1 ? sections : null;
}

// Marking scheme for a test — defaults to +1/0 (no negative marking) unless the
// test JSON explicitly sets correctMarks / negativeMarks.
function getMarkingScheme(test){
  return {
    correct: (typeof test.correctMarks==='number') ? test.correctMarks : 1,
    wrong: (typeof test.negativeMarks==='number') ? test.negativeMarks : 0
  };
}

// Caps each subject section of a test's questions at that exam's configured
// max (see SECTION_CAP_BY_EXAM below), in first-seen order. Any questions
// beyond the cap for a given subject are dropped entirely (not counted, not
// shown, not included in scoring).
// SCOPE: only exams with a fixed per-subject quota are capped here — SSC CGL
// and SSC CHSL (flat 25/subject: General Intelligence & Reasoning, General
// Awareness, Quantitative Aptitude, English Comprehension) and UPSSSC PET
// (per-subject, matching the official 15-section pattern — 5 for most
// subjects, 10 for Current Affairs / General Awareness / Analysis of 2
// Unread Hindi Passages / Graph Analysis & Interpretation / Table Analysis &
// Interpretation — NOT a flat 30, since that was the old incorrect 4-section
// grouping). Other exams (Banking, Teaching, Police, Railways, etc.) have
// their own section sizes and must NOT be capped here. Gate this by
// examKey, not just by whether a test has subject tags.
// A cap entry can be either a flat number (applies to every subject, as with
// ssc_cgl/ssc_chsl) or an object mapping each canonical subject name to its
// own cap (as with upsssc_pet) — subjects not listed in the object are left
// uncapped, since that's a data-tagging issue to fix in the Sheet, not
// something the frontend should silently truncate.
const SECTION_CAP_BY_EXAM = {
  ssc_cgl: 25,
  ssc_chsl: 25,
  upsssc_pet: {
    'Indian History': 5,
    'Indian National Movement': 5,
    'Geography': 5,
    'Indian Economy': 5,
    'Indian Constitution & Public Administration': 5,
    'General Science': 5,
    'Elementary Arithmetic': 5,
    'General Hindi': 5,
    'General English': 5,
    'Logic & Reasoning': 5,
    'Current Affairs': 10,
    'General Awareness': 10,
    'Analysis of 2 Unread Hindi Passages': 10,
    'Graph Analysis & Interpretation': 10,
    'Table Analysis & Interpretation': 10,
  }
};
function capQuestionsPerSection(questions, examKey){
  const capConfig = SECTION_CAP_BY_EXAM[examKey];
  if(!capConfig) return questions;
  const hasSubjects = questions.some(q=>q.subject);
  if(!hasSubjects) return questions;
  const counts={};
  return questions.filter(q=>{
    const subj = (q.subject || 'General').trim();
    const cap = (typeof capConfig === 'number') ? capConfig : capConfig[subj];
    counts[subj] = (counts[subj]||0)+1;
    if(cap == null) return true; // subject not in the per-subject map — leave uncapped
    return counts[subj] <= cap;
  });
}

// Groups questions into one contiguous run per subject, in first-appearance
// order — fixes source data where the same subject appears in several
// scattered runs (e.g. from questions added across many separate publish
// sessions) so the quiz always presents one clean block per subject,
// regardless of how the underlying JSON array is ordered. Each subject's
// own internal question order is preserved (stable grouping, not a sort).
function groupQuestionsBySubject(questions){
  const hasSubjects = questions.some(q=>q.subject);
  if(!hasSubjects) return questions;
  const buckets={}, order=[];
  questions.forEach(q=>{
    const subj=(q.subject||'General').trim();
    if(!buckets[subj]){ buckets[subj]=[]; order.push(subj); }
    buckets[subj].push(q);
  });
  return order.flatMap(subj=>buckets[subj]);
}

// ── QUIZ LOGIC ────────────────────────────────────────────────────────────────
function startQuiz(catKey,examKey,test,returnScreen){
  S.activeCatKey=catKey; S.activeExamKey=examKey;
  S.activeExam=(catKey && DATA[catKey] && DATA[catKey].exams) ? DATA[catKey].exams[examKey] : null;
  S.returnScreen = returnScreen || 'tests';
  const capped = capQuestionsPerSection([...test.questions], examKey);
  S.test={...test,questions:groupQuestionsBySubject(capped)};
  S.qi=0;S.ans={};S.flagged=new Set();S.visited=new Set([0]);
  S.timeLeft=test.duration*60;S.startTime=Date.now();
  S.navOpen=false;S.confirm=false;S.reviewOpen=false;S.stopConfirm=false;

  S.sectional = !!test.sectional;
  S.sectionLocked = new Set();
  if(S.sectional){
    S.sectionsCache = getSubjectSections(S.test) || [];
    S.sectionIndex = 0;
    S.sectionDurationSec = test.sectionDurationSec || Math.round((test.duration*60)/(S.sectionsCache.length||1));
    S.sectionTimeLeft = S.sectionDurationSec;
    if(S.sectionsCache.length){ S.qi = S.sectionsCache[0].indices[0]; S.visited=new Set([S.qi]); }
  } else {
    S.sectionsCache=null; S.sectionIndex=0; S.sectionTimeLeft=0; S.sectionDurationSec=0;
  }

  S.screen='quiz';render();startTimer();
}
function startTimer(){
  clearInterval(timerHandle);
  timerHandle=setInterval(()=>{
    S.timeLeft=Math.max(0,S.timeLeft-1); // overall exam time, always tracked (used for results timeTaken + total-remaining display)
    if(S.sectional){
      S.sectionTimeLeft=Math.max(0,S.sectionTimeLeft-1);
      if(S.sectionTimeLeft===0){ advanceSection(); return; }
    } else if(S.timeLeft===0){
      clearInterval(timerHandle);submit();return;
    }
    const d=document.getElementById('timerDisp');
    if(d){
      const displaySec = S.sectional ? S.sectionTimeLeft : S.timeLeft;
      d.textContent=fmt(displaySec);
      if(displaySec<60){ d.style.background=CBT.red; d.style.boxShadow='0 4px 14px rgba(220,38,38,0.4)'; }
    }
  },1000);
}

// Called when a section's 15-minute timer hits 0, OR the student manually ends the section early.
// Locks every question in the finishing section (no going back), then moves to the next section's
// first question with a fresh timer — or submits the whole test if this was the last section.
function advanceSection(){
  const sections=S.sectionsCache;
  if(!sections || !sections.length){ clearInterval(timerHandle); submit(); return; }
  const cur=sections[S.sectionIndex];
  cur.indices.forEach(i=>S.sectionLocked.add(i));
  if(S.sectionIndex>=sections.length-1){
    clearInterval(timerHandle); submit(); return;
  }
  S.sectionIndex++;
  const next=sections[S.sectionIndex];
  S.sectionTimeLeft=S.sectionDurationSec;
  S.qi=next.indices[0];
  S.visited.add(S.qi);
  render();
}
function goQ(idx){ if(S.sectionLocked.has(idx)) return; S.visited.add(idx);S.qi=idx;S.navOpen=false;render();}
function submit(){
  clearInterval(timerHandle);
  if(S.startTime) S.timeTaken=Math.floor((Date.now()-S.startTime)/1000);
  recordActivity();
  S.screen='results';S.confirm=false;S.navOpen=false;render();
}
function getResults(){
  if(!S.test) return null;
  let correct=0,wrong=0;
  S.test.questions.forEach((q,i)=>{
    if(S.ans[i]===undefined) return;
    S.ans[i]===q.ans?correct++:wrong++;
  });
  const total=S.test.questions.length;
  const marks=getMarkingScheme(S.test);
  const marksScored=correct*marks.correct - wrong*marks.wrong;
  const maxMarks=total*marks.correct;
  return{correct,wrong,unattempted:total-correct-wrong,score:Math.round((correct/total)*100),total,marksScored,maxMarks,marks};
}

function getSubjectBreakdown(){
  if(!S.test) return null;
  const hasSubjects = S.test.questions.some(q=>q.subject);
  if(!hasSubjects) return null;
  const bySubject = {};
  S.test.questions.forEach((q,i)=>{
    const subj = q.subject || 'Other';
    if(!bySubject[subj]) bySubject[subj] = {correct:0,wrong:0,unattempted:0,total:0};
    bySubject[subj].total++;
    const ua = S.ans[i];
    if(ua===undefined) bySubject[subj].unattempted++;
    else if(ua===q.ans) bySubject[subj].correct++;
    else bySubject[subj].wrong++;
  });
  return bySubject;
}

function subjectTip(subject){
  const key = String(subject||'').toLowerCase().trim();
  return SUBJECT_TIPS[key] || ('Review your basics in '+subject+' and practice more MCQs regularly to build confidence.');
}

function buildQuizInsights(results, breakdown, singleSubject){
  const strengths=[], weaknesses=[], tips=[];
  if(breakdown){
    const rows=[];
    Object.keys(breakdown).forEach(subj=>{
      const b=breakdown[subj];
      const attempted=b.correct+b.wrong;
      if(!attempted) return; // fully skipped subject — not enough info to judge
      const accuracy=Math.round((b.correct/attempted)*100);
      rows.push({subj,accuracy});
      if(accuracy>=80) strengths.push(subj+' — '+accuracy+'% accuracy');
      else if(accuracy<50){ weaknesses.push(subj+' — '+accuracy+'% accuracy'); tips.push(subjectTip(subj)); }
    });
    // if nothing crossed the absolute weak threshold, still call out the relatively weakest subject
    if(!weaknesses.length && rows.length>1){
      const worst = rows.reduce((a,b)=> (b.accuracy<a.accuracy ? b : a));
      weaknesses.push(worst.subj+' — your relatively weakest subject ('+worst.accuracy+'% accuracy)');
      tips.push(subjectTip(worst.subj));
    }
  } else if(singleSubject){
    const attempted=results.correct+results.wrong;
    if(attempted){
      const accuracy=Math.round((results.correct/attempted)*100);
      if(accuracy>=80) strengths.push(singleSubject+' — '+accuracy+'% accuracy');
      else if(accuracy<50){ weaknesses.push(singleSubject+' — '+accuracy+'% accuracy'); tips.push(subjectTip(singleSubject)); }
    }
  }
  if(results.unattempted > results.total*0.2){
    weaknesses.push(results.unattempted+' question(s) left unattempted');
    tips.push('Try to attempt every question — even an educated guess has a chance, while a skip guarantees zero.');
  }
  if(results.score>=80) strengths.push('Strong overall score ('+results.score+'%)');
  if(!strengths.length) strengths.push('Keep practicing — your strengths will show up as you build consistency.');
  if(!weaknesses.length) weaknesses.push('No major weak areas found in this test — well done!');
  return { strengths, weaknesses, tips:[...new Set(tips)] };
}
function qStatus(i){
  if(!S.visited.has(i)) return 'unvisited';
  const a=S.ans[i]!==undefined,f=S.flagged.has(i);
  if(a&&f) return 'ans-flag';if(a) return 'answered';if(f) return 'flagged';return 'visited';
}
function totalExams(){return Object.values(DATA).reduce((a,c)=>a+Object.keys(c.exams).length,0);}
function totalTests(){return Object.values(DATA).reduce((a,c)=>a+Object.values(c.exams).reduce((b,e)=>b+e.tests.length,0),0);}
function totalQuestions(){
  let count=0;
  for(const cat of Object.values(DATA)){
    for(const exam of Object.values(cat.exams)){
      for(const test of exam.tests){
        count += test.questions ? test.questions.length : (test.questionCount || 0);
      }
    }
  }
  return count;
}
function qCount(t){return t.questions?t.questions.length:(t.questionCount||0);}

function examContentSection(examKey){
  const c = EXAM_CONTENT[examKey];
  if(!c) return null;
  const wrap=el('div',{css:'background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:20px;margin-bottom:18px;'});
  wrap.appendChild(el('h3',{css:'font-family:Syne,sans-serif;font-weight:800;font-size:16px;color:#0f172a;margin-bottom:10px;',text:'Exam Pattern & Syllabus'}));
  wrap.appendChild(el('p',{css:'font-size:13px;color:#475569;line-height:1.7;margin-bottom:14px;',text:c.intro}));
  const table=el('table',{css:'width:100%;border-collapse:collapse;margin-bottom:14px;font-size:12px;'});
  const thead=el('tr',{css:'background:#f8fafc;'});
  ['Section','Questions','Marks'].forEach(h=>thead.appendChild(el('th',{css:'text-align:left;padding:8px 10px;border-bottom:1.5px solid #e2e8f0;color:#64748b;font-weight:700;',text:h})));
  table.appendChild(thead);
  c.sections.forEach(s=>{
    const row=el('tr',{});
    row.appendChild(el('td',{css:'padding:8px 10px;border-bottom:1px solid #f1f5f9;color:#0f172a;',text:s.name}));
    row.appendChild(el('td',{css:'padding:8px 10px;border-bottom:1px solid #f1f5f9;color:#0f172a;',text:String(s.qs)}));
    row.appendChild(el('td',{css:'padding:8px 10px;border-bottom:1px solid #f1f5f9;color:#0f172a;',text:String(s.marks)}));
    table.appendChild(row);
  });
  wrap.appendChild(table);
  const metaRow=el('div',{css:'display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px;'});
  [['⏱ Duration',c.duration],['✗ Negative Marking',c.negativeMarking]].forEach(([label,val])=>{
    metaRow.appendChild(el('div',{css:'font-size:12px;color:#475569;'},[el('strong',{css:'color:#0f172a;',text:label+': '}),val]));
  });
  wrap.appendChild(metaRow);

  return wrap;
}

function examCard(catKey,examKey,exam,color){
  const tc=exam.tests.length,qc=exam.tests.reduce((a,t)=>a+qCount(t),0);
  const dark=shadeColor(color,-22);
  const card=el('div',{css:`background:linear-gradient(135deg,${color},${dark});border-radius:16px;padding:17px 15px;cursor:pointer;transition:all 0.18s;box-shadow:0 4px 14px ${color}4d;position:relative;overflow:hidden;`});
  card.appendChild(el('div',{css:`position:absolute;top:-26px;right:-26px;width:80px;height:80px;background:rgba(255,255,255,0.14);border-radius:50%;pointer-events:none;`}));
  card.appendChild(el('div',{css:`position:absolute;bottom:-30px;left:-16px;width:70px;height:70px;background:rgba(255,255,255,0.08);border-radius:50%;pointer-events:none;`}));
  card.appendChild(el('div',{css:'font-size:24px;margin-bottom:8px;position:relative;',text:'📝'}));
  card.appendChild(el('div',{css:'font-family:Syne,sans-serif;font-weight:800;font-size:13px;color:#fff;margin-bottom:3px;position:relative;',text:exam.name}));
  card.appendChild(el('div',{css:'font-size:10px;color:rgba(255,255,255,0.85);margin-bottom:11px;line-height:1.4;position:relative;',text:exam.fullname}));
  const tags=el('div',{css:'display:flex;gap:6px;flex-wrap:wrap;position:relative;'});
  tags.appendChild(el('span',{css:`background:rgba(255,255,255,0.25);color:#fff;font-size:10px;font-weight:700;padding:3px 9px;border-radius:8px;`,text:`${tc} Tests`}));
  tags.appendChild(el('span',{css:'background:rgba(255,255,255,0.25);color:#fff;font-size:10px;font-weight:600;padding:3px 9px;border-radius:8px;',text:`${qc} Qs`}));
  card.appendChild(tags);
  card.addEventListener('mouseenter',()=>{card.style.transform='translateY(-3px)';card.style.boxShadow=`0 8px 22px ${color}66`;});
  card.addEventListener('mouseleave',()=>{card.style.transform='';card.style.boxShadow=`0 4px 14px ${color}4d`;});
  card.addEventListener('click',()=>{S.activeCatKey=catKey;S.activeExamKey=examKey;S.activeExam=exam;navigateToExam(catKey,examKey,exam);go('tests');});
  return card;
}

// ── TESTS SCREEN ──────────────────────────────────────────────────────────────
function testsScreen(){
  const cat=DATA[S.activeCatKey],exam=S.activeExam;
  const root=el('div');root.appendChild(Navbar());
  const hdr=el('div',{css:`background:linear-gradient(135deg,${cat.color}15,${cat.color}04);padding:20px;border-bottom:1px solid #e2e8f0;`});
  hdr.appendChild(el('button',{css:'background:none;border:none;color:#64748b;font-size:13px;cursor:pointer;margin-bottom:10px;display:flex;align-items:center;gap:4px;padding:0;',text:'← Back',onClick:()=>go('exams')}));
  hdr.appendChild(el('div',{css:'display:flex;align-items:center;gap:8px;margin-bottom:6px;'},[el('span',{css:`background:${cat.color};color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:8px;`,text:cat.name})]));
  hdr.appendChild(el('h2',{css:'font-family:Syne,sans-serif;font-weight:800;font-size:20px;color:#0f172a;margin-bottom:3px;',text:exam.name}));
  hdr.appendChild(el('p',{css:'font-size:12px;color:#64748b;',text:exam.fullname}));
  root.appendChild(hdr);
  const body=el('div',{css:'padding:20px;max-width:800px;margin:0 auto;'});
  body.appendChild(el('p',{css:'font-size:13px;color:#64748b;margin-bottom:18px;line-height:1.6;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;',text:'⚠️ Tests are timed. Once started, the timer cannot be paused. The test auto-submits when time expires.'}));
  const contentSection = examContentSection(S.activeExamKey);
  if(contentSection) body.appendChild(contentSection);
  exam.tests.forEach((t,i)=>{
    const dc={Easy:['#f0fdf4','#16a34a'],Medium:['#fffbeb','#d97706'],Hard:['#fef2f2','#dc2626']}[t.difficulty]||['#f8fafc','#64748b'];
    const card=el('div',{css:`background:#fff;border:1.5px solid #e2e8f0;border-left:5px solid ${cat.color};border-radius:14px;padding:18px;margin-bottom:12px;box-shadow:0 2px 8px ${cat.color}1a;`});
    const top=el('div',{css:'display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;'});
    top.appendChild(el('div',{},[el('div',{css:'font-family:Syne,sans-serif;font-weight:700;font-size:15px;color:#0f172a;margin-bottom:3px;',text:t.title}),el('div',{css:'font-size:11px;color:#94a3b8;',text:`Mock Test ${i+1}`})]));
    top.appendChild(el('span',{css:`background:${dc[0]};color:${dc[1]};font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;`,text:t.difficulty}));
    card.appendChild(top);
    const meta=el('div',{css:'display:flex;gap:18px;margin-bottom:16px;'});
    [['⏱',`${t.duration} min`],['❓',`${qCount(t)} Questions`],['📝','MCQ Format']].forEach(([ic,tx])=>meta.appendChild(el('div',{css:'display:flex;align-items:center;gap:5px;font-size:12px;color:#64748b;'},[el('span',{text:ic}),tx])));
    card.appendChild(meta);
    const btn=el('button',{css:`width:100%;padding:13px;background:linear-gradient(135deg,${cat.color},${shadeColor(cat.color,-18)});color:#fff;border:none;border-radius:10px;font-family:Syne,sans-serif;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 3px 10px ${cat.color}4d;`,text:'Start Mock Test →'});
    btn.addEventListener('click',async()=>{
      if(btn.dataset.loading) return;
      btn.dataset.loading='1';
      btn.textContent='Loading...';btn.style.opacity='0.7';
      try{
        const fullTest=await loadFullTest(S.activeExamKey,t.id,t);
        btn.style.opacity='1';delete btn.dataset.loading;btn.textContent='Start Mock Test →';
        startQuiz(S.activeCatKey,S.activeExamKey,fullTest);
      }catch(e){
        btn.textContent='Failed — Tap to Retry';btn.style.opacity='1';delete btn.dataset.loading;
      }
    });
    card.appendChild(btn);body.appendChild(card);
  });
  root.appendChild(body);root.appendChild(Footer());
  return root;
}

// ── QUIZ SCREEN ───────────────────────────────────────────────────────────────
function quizScreen(){
  const test=S.test,qs=test.questions,q=qs[S.qi],sel=S.ans[S.qi];
  syncLangToggleForQuestion(q);
  const cat=DATA[S.activeCatKey];
  const accent=cat?cat.color:'#0ea5e9';
  const answered=Object.keys(S.ans).length;
  const sections=getSubjectSections(test);
  const marks=getMarkingScheme(test);
  const currentSubject=q.subject||null;

  const root=el('div',{css:`min-height:100vh;background:${CBT.bg};font-family:'DM Sans',sans-serif;color:${CBT.text};`});

  // Minimal top utility bar — exit + language toggle slot + mobile palette toggle.
  // The language toggle lives here (not floating) so it never sits on top of
  // Save & Next or the mobile question-palette bottom sheet.
  const topBar=el('div',{css:`position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid ${CBT.border};padding:8px 14px;display:flex;align-items:center;gap:10px;`});
  topBar.appendChild(el('button',{css:`background:${CBT.gridBg};border:1px solid ${CBT.border};color:${CBT.muted};width:30px;height:30px;border-radius:8px;font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;`,text:'✕',onClick:()=>{S.stopConfirm=true;render();}}));
  topBar.appendChild(el('div',{id:'langFloatSlot',css:'flex:1;display:flex;justify-content:center;align-items:center;min-width:0;'}));
  topBar.appendChild(el('button',{class:'qb-mobile-nav-btn',css:`background:${accent};color:#fff;border:none;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;`,text:`📋 ${answered}/${qs.length}`,onClick:()=>{S.navOpen=true;render();}}));
  root.appendChild(topBar);

  const container=el('div',{class:'qb-container',css:'max-width:1100px;margin:0 auto;padding:16px;'});
  const mainCol=el('div',{class:'qb-main-col'});

  // Exam title header
  const examHeader=el('div',{css:'text-align:center;margin-bottom:12px;'});
  examHeader.appendChild(el('div',{css:`font-family:Syne,sans-serif;font-weight:800;font-size:19px;color:${accent};`,text:(S.activeExam?S.activeExam.name:(cat?cat.name:'Mock Test'))}));
  examHeader.appendChild(el('div',{css:`font-family:Syne,sans-serif;font-weight:700;font-size:14px;color:${CBT.text};margin-top:2px;`,text:test.title}));
  mainCol.appendChild(examHeader);

  // Info bar: question count, time, marking scheme
  const infoBar=el('div',{css:`background:#fff;border:1px solid ${CBT.border};border-radius:10px;padding:10px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 24px;font-size:12px;color:${CBT.text};`});
  const timeLabel = S.sectional ? test.duration+' min (strict '+Math.round(S.sectionDurationSec/60)+' min per section)' : test.duration+' min';
  const infoItems=[['Number Of Questions',String(qs.length)],['Time',timeLabel],['Correct Answer Carries','+'+marks.correct]];
  if(marks.wrong>0) infoItems.push(['Wrong Answer Carries','-'+marks.wrong]);
  infoItems.forEach(([label,val])=>{
    infoBar.appendChild(el('div',{},[el('strong',{text:label+': '}),val]));
  });
  mainCol.appendChild(infoBar);

  // Big countdown pill — shows CURRENT SECTION time when sectional, else overall exam time
  const displaySec = S.sectional ? S.sectionTimeLeft : S.timeLeft;
  const timerWrap=el('div',{css:'text-align:center;margin-bottom:8px;'});
  timerWrap.appendChild(el('div',{id:'timerDisp',css:`display:inline-block;background:${CBT.green};color:#fff;padding:10px 34px;border-radius:30px;font-family:Syne,sans-serif;font-weight:800;font-size:20px;box-shadow:0 4px 14px rgba(22,163,74,0.35);`,text:fmt(displaySec)}));
  mainCol.appendChild(timerWrap);
  if(S.sectional && S.sectionsCache && S.sectionsCache.length){
    mainCol.appendChild(el('div',{css:`text-align:center;font-size:11px;color:${CBT.muted};margin-bottom:14px;`,text:'Section '+(S.sectionIndex+1)+' of '+S.sectionsCache.length+' · Total time remaining: '+fmt(S.timeLeft)}));
  } else {
    mainCol.appendChild(el('div',{css:'margin-bottom:8px;'}));
  }

  // Subject section heading
  if(currentSubject){
    mainCol.appendChild(el('div',{css:`text-align:center;font-family:Syne,sans-serif;font-weight:800;font-size:17px;color:${CBT.text};margin-bottom:14px;`,text:currentSubject}));
  }

  // Question card
  const qCard=el('div',{css:`background:#fff;border:1px solid ${CBT.border};border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,0.06);`});
  const qTextWrap=el('div',{css:'display:flex;gap:8px;margin-bottom:18px;'});
  qTextWrap.appendChild(el('div',{css:`font-weight:700;color:${accent};flex-shrink:0;`,text:(S.qi+1)+'.'}));
  const qTextInner=el('div',{css:'flex:1;'});
  qTextInner.appendChild(el('div',{css:`font-size:15px;line-height:1.7;color:${CBT.text};`,text:q.q}));
  if(q.img){
    qTextInner.appendChild(el('img',{src:q.img,alt:'Question image',css:`max-width:100%;max-height:320px;display:block;margin-top:10px;border-radius:8px;border:1px solid ${CBT.border};`}));
  }
  if(S.lang==='hi'&&q.q_hi&&!isLanguageSkillSubject(q.subject)){
    qTextInner.appendChild(el('div',{css:`font-size:14px;color:#4338ca;margin-top:6px;line-height:1.7;`,text:q.q_hi}));
  }
  qTextWrap.appendChild(qTextInner);
  qCard.appendChild(qTextWrap);

  // Options — classic radio-button rows, 2 per line
  const optsGrid=el('div',{css:'display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:18px;'});
  q.opts.forEach((opt,i)=>{
    const isSel=sel===i;
    const hindiOpt=(S.lang==='hi'&&q.opts_hi&&q.opts_hi[i]&&!isLanguageSkillSubject(q.subject))?q.opts_hi[i]:null;
    const row=el('label',{css:`display:flex;align-items:flex-start;gap:9px;cursor:pointer;font-size:14px;color:${CBT.text};padding:6px;border-radius:8px;`});
    const radio=el('input',{type:'radio',name:'qopt',css:`margin-top:3px;accent-color:${accent};cursor:pointer;flex-shrink:0;width:16px;height:16px;`});
    if(isSel) radio.checked=true;
    radio.addEventListener('change',()=>{S.ans[S.qi]=i;render();});
    row.appendChild(radio);
    const optText=el('div',{css:'flex:1;line-height:1.5;'});
    optText.appendChild(el('span',{css:'font-weight:600;margin-right:4px;',text:'('+(i+1)+')'}));
    if(hindiOpt){
      optText.appendChild(el('span',{text:hindiOpt}));
      optText.appendChild(el('div',{css:`font-size:12px;color:${CBT.muted};margin-top:2px;`,text:opt}));
    } else {
      optText.appendChild(el('span',{text:opt}));
    }
    if(q.opts_img && q.opts_img[i]){
      optText.appendChild(el('img',{src:q.opts_img[i],alt:'Option '+(i+1)+' image',css:`max-width:100%;max-height:140px;display:block;margin-top:6px;border-radius:6px;border:1px solid ${CBT.border};`}));
    }
    row.appendChild(optText);
    optsGrid.appendChild(row);
  });
  qCard.appendChild(optsGrid);

  // Clear Response / Review Later
  const isFlagged=S.flagged.has(S.qi);
  const actionRow=el('div',{css:'display:flex;gap:10px;flex-wrap:wrap;'});
  actionRow.appendChild(el('button',{css:`padding:9px 18px;background:#fff;border:1.5px solid ${CBT.border};color:${CBT.text};border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;`,text:'Clear Response',onClick:()=>{delete S.ans[S.qi];render();}}));
  actionRow.appendChild(el('button',{css:`padding:9px 18px;background:${isFlagged?CBT.purple+'18':'#fff'};border:1.5px solid ${isFlagged?CBT.purple:CBT.border};color:${isFlagged?CBT.purple:CBT.text};border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;`,text:isFlagged?'✓ Marked for Review':'Review Later',onClick:()=>{isFlagged?S.flagged.delete(S.qi):S.flagged.add(S.qi);render();}}));
  if(REPORT_ENDPOINT_URL){
    actionRow.appendChild(el('button',{css:`padding:9px 18px;background:#fff;border:1.5px solid ${CBT.border};color:#b91c1c;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;`,text:'🚩 Report Question',onClick:()=>openReportModal(q)}));
  }
  qCard.appendChild(actionRow);
  mainCol.appendChild(qCard);

  // Previous / Save & Next / Submit Section / Submit Test — all section-aware
  const curSection = (S.sectional && S.sectionsCache) ? S.sectionsCache[S.sectionIndex] : null;
  const isSectionFirstQ = curSection ? (S.qi===curSection.indices[0]) : (S.qi===0);
  const isSectionLastQ = curSection ? (S.qi===curSection.indices[curSection.indices.length-1]) : (S.qi===qs.length-1);
  const isFinalSection = !S.sectional || (S.sectionsCache && S.sectionIndex===S.sectionsCache.length-1);
  const prevDisabled = S.sectional ? isSectionFirstQ : (S.qi===0);

  const navRow=el('div',{css:'display:flex;gap:10px;margin-bottom:20px;'});
  navRow.appendChild(el('button',{css:`flex:1;padding:12px;background:#fff;border:1.5px solid ${CBT.border};color:${prevDisabled?'#cbd5e1':CBT.text};border-radius:10px;font-weight:600;font-size:14px;cursor:pointer;`,text:'← Previous',onClick:()=>{if(!prevDisabled)goQ(S.qi-1);}}));
  if(isSectionLastQ && isFinalSection){
    navRow.appendChild(el('button',{css:`flex:1;padding:12px;background:${CBT.green};border:none;color:#fff;border-radius:10px;font-family:Syne,sans-serif;font-weight:700;font-size:14px;cursor:pointer;`,text:'Submit Test',onClick:()=>{S.confirm=true;render();}}));
  } else if(isSectionLastQ && !isFinalSection){
    navRow.appendChild(el('button',{css:`flex:1;padding:12px;background:${accent};border:none;color:#fff;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;`,text:'Submit Section & Continue →',onClick:()=>advanceSection()}));
  } else {
    navRow.appendChild(el('button',{css:`flex:1;padding:12px;background:${accent};border:none;color:#fff;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;`,text:'Save & Next →',onClick:()=>goQ(S.qi+1)}));
  }
  mainCol.appendChild(navRow);

  // Inline palette copy — always visible directly on the page on mobile (below the fold, via scroll),
  // so the question table is never missed. Hidden on desktop, where the sticky sidebar already shows it.
  const mobilePaletteWrap=el('div',{class:'qb-mobile-palette',css:'margin-bottom:20px;'});
  mobilePaletteWrap.appendChild(el('div',{css:`font-family:Syne,sans-serif;font-weight:700;font-size:13px;color:${CBT.text};margin-bottom:10px;`,text:'Question Palette'}));
  mobilePaletteWrap.appendChild(buildQuestionPalette(qs,sections,accent));
  mainCol.appendChild(mobilePaletteWrap);

  container.appendChild(mainCol);

  // Sidebar (desktop: always visible; mobile: hidden here since the inline copy above + the
  // quick-jump bottom sheet already cover it)
  const sidebar=el('div',{class:'qb-sidebar'});
  sidebar.appendChild(buildQuestionPalette(qs,sections,accent));
  container.appendChild(sidebar);

  root.appendChild(container);
  if(S.navOpen) root.appendChild(navPanel(qs,accent));
  if(S.confirm) root.appendChild(confirmPanel(qs,answered));
  if(S.stopConfirm) root.appendChild(stopConfirmPanel());
  return root;
}

// Shared question-palette builder — used both in the desktop sidebar and the mobile bottom sheet
function buildQuestionPalette(qs,sections,accent){
  const wrap=el('div',{css:`background:#fff;border:1px solid ${CBT.border};border-radius:14px;padding:16px;`});

  // Legend + counts — always computed across the WHOLE test, not just the visible subject
  const counts={unvisited:0,visited:0,answered:0,flagged:0,'ans-flag':0};
  qs.forEach((_,i)=>{counts[qStatus(i)]++;});
  const answeredTotal=counts.answered+counts['ans-flag'];
  const flaggedTotal=counts.flagged+counts['ans-flag'];
  const legend=el('div',{css:'display:flex;justify-content:space-between;margin-bottom:14px;'});
  [[CBT.green,'Answered',answeredTotal],[CBT.purple,'Marked',flaggedTotal],[CBT.unvisited,'Remaining',qs.length-answeredTotal]].forEach(([c,label,val])=>{
    legend.appendChild(el('div',{css:'text-align:center;flex:1;'},[
      el('div',{css:`width:14px;height:14px;background:${c};border-radius:3px;margin:0 auto 4px;`}),
      el('div',{css:`font-weight:700;font-size:13px;color:${CBT.text};`,text:String(val)}),
      el('div',{css:`color:${CBT.muted};font-size:10px;`,text:label})
    ]));
  });
  wrap.appendChild(legend);

  // Grid — global 1..N numbering by default (subject tabs below are just quick-jump shortcuts).
  // Only switches to subject-scoped local numbering + locking for tests with STRICT sectional
  // timing enabled (test.sectional === true), where real exams restrict you to the current section.
  const currentSubj=qs[S.qi]?qs[S.qi].subject:null;
  let gridIndices, localNumbering;
  if(S.sectional && sections){
    const activeSection=sections.find(s=>s.subject===currentSubj)||sections[0];
    gridIndices=activeSection.indices; localNumbering=true;
  } else {
    gridIndices=qs.map((_,i)=>i); localNumbering=false;
  }
  const grid=el('div',{css:'display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px;'});
  gridIndices.forEach((globalIdx,localIdx)=>{
    const st=qStatus(globalIdx),c=CBT_ST[st];
    const label=localNumbering?String(localIdx+1):String(globalIdx+1);
    const locked=S.sectionLocked.has(globalIdx);
    const btn=el('button',{
      css:locked
        ? `padding:8px 0;border-radius:8px;background:#f1f5f9;border:2px solid #e2e8f0;color:#cbd5e1;font-weight:700;font-size:12px;cursor:not-allowed;`
        : `padding:8px 0;border-radius:8px;background:${globalIdx===S.qi?c:'#fff'};border:2px solid ${c};color:${globalIdx===S.qi?'#fff':c};font-weight:700;font-size:12px;cursor:pointer;`,
      text:label
    });
    if(!locked) btn.addEventListener('click',()=>goQ(globalIdx));
    grid.appendChild(btn);
  });
  wrap.appendChild(grid);

  // Subject tabs — pure status indicators during sectional mode (no jumping between sections allowed);
  // fully clickable navigation when not sectional (e.g. regular multi-subject mock tests)
  if(sections){
    const tabWrap=el('div',{css:'display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;'});
    sections.forEach(sec=>{
      const isActive=sec.subject===currentSubj;
      const isLockedSection=S.sectional && sec.indices.every(i=>S.sectionLocked.has(i));
      const clickable=!S.sectional; // in sectional mode, tabs are display-only
      const tabBtn=el('button',{css:`padding:8px 14px;border-radius:8px;border:1.5px solid ${isActive?accent:CBT.border};background:${isActive?accent:isLockedSection?'#f1f5f9':'#fff'};color:${isActive?'#fff':isLockedSection?'#cbd5e1':CBT.text};font-size:12px;font-weight:700;cursor:${clickable?'pointer':'default'};`,text:(isLockedSection?'✓ ':'')+sec.subject});
      if(clickable) tabBtn.addEventListener('click',()=>goQ(sec.indices[0]));
      tabWrap.appendChild(tabBtn);
    });
    // A section belongs to this exam's official pattern (EXAM_CONTENT) but has
    // zero live questions yet — show it as a disabled "coming soon" tab rather
    // than silently omitting it, so it's clear the section is planned, not
    // missing by mistake.
    const officialSections = EXAM_CONTENT[S.activeExamKey] ? EXAM_CONTENT[S.activeExamKey].sections : [];
    const liveSubjects = new Set(sections.map(sec=>sec.subject));
    officialSections.forEach(off=>{
      if(liveSubjects.has(off.name)) return;
      tabWrap.appendChild(el('button',{
        css:`padding:8px 14px;border-radius:8px;border:1.5px dashed ${CBT.border};background:transparent;color:${CBT.muted};font-size:12px;font-weight:700;cursor:not-allowed;`,
        text:off.name+' — coming soon',
        title:'No questions added for this section yet'
      }));
    });
    wrap.appendChild(tabWrap);
  }

  // Fullscreen + Submit
  const actionsRow=el('div',{css:'display:flex;gap:8px;'});
  const fsBtn=el('button',{css:`width:40px;height:40px;background:#fff;border:1.5px solid ${CBT.border};border-radius:8px;font-size:16px;cursor:pointer;flex-shrink:0;`,text:'⛶'});
  fsBtn.addEventListener('click',()=>{
    if(!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(()=>{}); }
    else { document.exitFullscreen().catch(()=>{}); }
  });
  actionsRow.appendChild(fsBtn);
  actionsRow.appendChild(el('button',{css:`flex:1;padding:10px;background:${CBT.green};border:none;color:#fff;border-radius:8px;font-family:Syne,sans-serif;font-weight:700;font-size:14px;cursor:pointer;`,text:'Submit',onClick:()=>{S.navOpen=false;S.confirm=true;render();}}));
  wrap.appendChild(actionsRow);

  return wrap;
}

function navPanel(qs,accent){

// ── RESULTS ───────────────────────────────────────────────────────────────────
function resultsScreen(){
  const r=getResults();
  const{correct,wrong,unattempted,score,total}=r;
  const cat=DATA[S.activeCatKey];
  const accent=cat?cat.color:'#0ea5e9';
  const C=2*Math.PI*58,filled=(score/100)*C;
  const ringColor=score>=75?Q.green:score>=40?accent:Q.red;
  const root=el('div',{css:`min-height:100vh;background:${Q.bg};font-family:'DM Sans',sans-serif;color:${Q.text};`});
  const hdr=el('div',{css:`padding:12px 20px;background:${Q.surface};border-bottom:1px solid ${Q.border};display:flex;align-items:center;gap:12px;`});
  hdr.appendChild(el('button',{css:`background:none;border:none;color:${Q.muted};font-size:22px;cursor:pointer;`,text:'←',onClick:()=>{S.screen=S.returnScreen;render();}}));
  hdr.appendChild(el('div',{},[el('div',{css:`font-family:Syne,sans-serif;font-weight:700;font-size:17px;color:${Q.text};`,text:'Test Results'}),el('div',{css:`font-size:11px;color:${Q.muted};margin-top:1px;`,text:S.test.title})]));
  root.appendChild(hdr);
  const body=el('div',{css:'padding:22px 20px 40px;max-width:600px;margin:0 auto;'});
  const sw=el('div',{css:'text-align:center;margin-bottom:24px;'});
  sw.innerHTML=`<svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="58" fill="none" stroke="${Q.card}" stroke-width="10"/><circle cx="75" cy="75" r="58" fill="none" stroke="${ringColor}" stroke-width="10" stroke-dasharray="${filled} ${C}" stroke-linecap="round" transform="rotate(-90 75 75)"/><text x="75" y="68" text-anchor="middle" fill="#f1f5f9" font-size="26" font-weight="800" font-family="Syne">${score}%</text><text x="75" y="90" text-anchor="middle" fill="#94a3b8" font-size="11">${correct}/${total} correct</text></svg>`;
  sw.appendChild(el('div',{css:`font-family:Syne,sans-serif;font-weight:800;font-size:20px;margin-top:4px;color:${Q.text};`,text:score>=75?'🎉 Excellent!':score>=40?'👍 Good Effort!':'📚 Keep Practicing!'}));
  sw.appendChild(el('div',{css:`font-size:12px;color:${Q.muted};margin-top:4px;`,text:`Time: ${Math.floor(S.timeTaken/60)}m ${S.timeTaken%60}s`}));
  body.appendChild(sw);
  const sg=el('div',{css:'display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;'});
  [[Q.green,'✓','Correct',correct],[Q.red,'✗','Wrong',wrong],[Q.dim,'–','Skipped',unattempted],[Q.muted,'⏱','Duration',`${S.test.duration}m`]].forEach(([c,ic,lb,vl])=>{
    sg.appendChild(el('div',{css:`background:${Q.card};border:1px solid ${Q.border};border-radius:12px;padding:14px 12px;`},[el('div',{css:`color:${c};font-size:20px;margin-bottom:4px;`,text:ic}),el('div',{css:`font-family:Syne,sans-serif;font-weight:700;font-size:22px;color:${c};`,text:String(vl)}),el('div',{css:`font-size:11px;color:${Q.muted};`,text:lb})]));
  });
  body.appendChild(sg);

  if(r.marks.wrong>0){
    const gained = correct*r.marks.correct;
    const lost = wrong*r.marks.wrong;
    const netPct = r.maxMarks>0 ? Math.max(0, Math.min(100, (r.marksScored/r.maxMarks)*100)) : 0;
    const mb = el('div',{css:`background:${Q.card};border:1px solid ${Q.border};border-radius:14px;padding:18px 18px 16px;margin-bottom:16px;`});
    mb.appendChild(el('div',{css:`font-family:Syne,sans-serif;font-weight:700;font-size:13px;color:${Q.text};margin-bottom:12px;letter-spacing:.02em;`,text:'⚖️ Marks Breakdown'}));

    const row=(icon,label,detail,value,color)=>el('div',{css:'display:flex;align-items:center;gap:10px;padding:6px 0;'},[
      el('span',{css:'font-size:15px;width:20px;',text:icon}),
