<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Revision – quick MCQs from your own books</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>
:root{--paper:#fbfaf5;--ink:#1c2a4a;--mark:#ffe46b;--red:#c8372d;--ok:#1f7a4d;--line:#d9d6c8;--mute:#5d6477}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif;padding:20px 16px 60px;max-width:640px;margin-inline:auto}
h1{font:700 28px/1.2 Georgia,serif;margin:8px 0 4px}
h1 span{background:linear-gradient(transparent 55%,var(--mark) 55%)}
p.sub{color:var(--mute);margin:0 0 20px}
.box{border:1.5px solid var(--ink);border-radius:6px;padding:14px;margin:14px 0;background:#fff}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=file],input[type=number],select{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
.row{display:flex;gap:10px;margin-top:10px}.row>div{flex:1}
button{font:600 16px system-ui;padding:12px 16px;border:0;border-radius:6px;background:var(--ink);color:#fff;width:100%;margin-top:12px;cursor:pointer}
button.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.note{margin:0;padding-left:18px}.note li{margin:6px 0}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1.5px solid var(--line);margin-top:8px;font-weight:500}
.opt:disabled{opacity:1}
.opt.right{border-color:#145a37;background:#1f7a4d;color:#fff;font-weight:700}.opt.right::before{content:"✓ "}
.opt.wrong{border-color:#8f241c;background:#c8372d;color:#fff;font-weight:700}.opt.wrong::before{content:"✗ "}
.meta{color:var(--mute);font-size:14px}
.tip{background:#fffbe0;border-left:4px solid var(--mark);padding:8px 10px;font-size:14px;margin:10px 0 0}
.exp{border-left:4px solid var(--mark);padding:6px 10px;margin-top:12px;background:#fffbe0}
.hide{display:none}.err{color:var(--red);font-weight:600}
</style>
</head>
<body>
<h1>Book <span>Revision</span></h1>
<p class="sub">Upload a PDF or take photos of your book pages. Get key points and MCQs from that text only.</p>

<section id="auth" class="box">
  <div id="loggedOut"><button id="login" style="margin-top:0">Sign in with Google</button><p class="meta" style="margin-bottom:0">Sign in to get 2 free revision sets.</p></div>
  <div id="loggedIn" class="hide"><span id="who" class="meta"></span><br><b id="bal">0</b> sets left
    <button id="logout" class="alt" style="width:auto;padding:6px 12px;margin:0 0 0 8px;font-size:14px">Sign out</button></div>
</section>

<section id="setup" class="box hide">
  <label for="pdf">Book PDF or page photos (JPG)</label>
  <input id="pdf" type="file" accept="application/pdf,image/*" multiple>
  <div class="tip">Photos: keep the page flat, in good light, one page per photo. Choose up to 8 photos.</div>
  <p id="info" class="meta"></p>
  <div class="row" id="rangeRow">
    <div><label for="from">From page</label><input id="from" type="number" min="1" value="1"></div>
    <div><label for="to">To page</label><input id="to" type="number" min="1" value="10"></div>
  </div>
  <div class="row">
    <div><label for="count">Questions</label><select id="count"><option>10</option><option selected>15</option><option>25</option></select></div>
    <div><label for="lang">Language</label><select id="lang"><option>English</option><option>Hindi</option><option>Hinglish</option></select></div>
  </div>
  <button id="go" disabled>Make revision set</button>
  <p id="msg" class="meta" role="status"></p>
</section>

<section id="notes" class="box hide"><h2 style="font:700 20px Georgia,serif;margin:0 0 6px">Key points</h2><ul class="note" id="nl"></ul><button id="start">Start quiz</button></section>

<section id="quiz" class="box hide">
  <div class="meta" id="prog"></div>
  <h2 id="q" style="font:600 19px/1.4 Georgia,serif;margin:8px 0"></h2>
  <div id="opts"></div>
  <div id="exp" class="exp hide"></div>
  <button id="next" class="hide">Next</button>
</section>

<section id="done" class="box hide">
  <h2 style="font:700 22px Georgia,serif;margin:0" id="score"></h2>
  <p class="meta" id="wrongInfo"></p>
  <button id="retry">Practise wrong ones again</button>
  <button id="again" class="alt">New pages</button>
</section>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
const SUPABASE_URL='PASTE_YOUR_SUPABASE_URL_HERE',SUPABASE_ANON='PASTE_YOUR_ANON_KEY_HERE';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
let session=null;
async function refreshAuth(){
  const {data}=await sb.auth.getSession();session=data.session;
  $('loggedOut').classList.toggle('hide',!!session);$('loggedIn').classList.toggle('hide',!session);
  if(!session){show();return}
  $('who').textContent=session.user.email;
  if(!['setup','notes','quiz','done'].some(x=>!$(x).classList.contains('hide')))show('setup');
  const {data:c}=await sb.from('credits').select('balance').maybeSingle();
  $('bal').textContent=c?c.balance:0;
}
$('login').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
$('logout').onclick=async()=>{await sb.auth.signOut();refreshAuth()};
sb.auth.onAuthStateChange(()=>{setTimeout(refreshAuth,0)});
const MAXIMG=8, MAXSIDE=1500, QUAL=0.72;
let mode='',pages=[],pdfDoc=null,imgs=[],set=null,deck=[],i=0,wrong=[],correct=0;
const show=(...ids)=>['setup','notes','quiz','done'].forEach(s=>$(s).classList.toggle('hide',!ids.includes(s)));

// Shrink a phone photo so it uploads fast (phone photos are often 5 MB+)
function toB64(src,w,h){
  const k=Math.min(1,MAXSIDE/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.round(w*k);c.height=Math.round(h*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',QUAL).split(',')[1];
}
function photoB64(file){
  return new Promise((ok,bad)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{try{ok(toB64(im,im.naturalWidth,im.naturalHeight))}catch(e){bad(e)}URL.revokeObjectURL(u)};
    im.onerror=()=>bad(new Error('bad image'));im.src=u;
  });
}

$('pdf').onchange=async e=>{
  const files=[...e.target.files];if(!files.length)return;
  $('go').disabled=true;$('msg').textContent='';pages=[];imgs=[];pdfDoc=null;mode='';
  const pdf=files.find(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));
  try{
    if(pdf){
      $('info').textContent='Reading PDF…';$('rangeRow').classList.remove('hide');
      pdfDoc=await pdfjsLib.getDocument({data:await pdf.arrayBuffer()}).promise;
      for(let n=1;n<=pdfDoc.numPages;n++){
        const t=await(await pdfDoc.getPage(n)).getTextContent();
        pages.push(t.items.map(x=>x.str).join(' ').replace(/\s+/g,' ').trim());
      }
      const filled=pages.filter(p=>p.length>80).length;
      if(filled<pages.length*0.3){
        mode='scan';$('to').value=Math.min(5,pages.length);
        $('info').textContent=pages.length+' pages found. This is a scanned book, so pages will be read as pictures. Pick up to 8 pages.';
      }else{
        mode='text';$('to').value=Math.min(10,pages.length);
        $('info').textContent=pages.length+' pages found. Pick a page range of about 10 pages.';
      }
      $('go').disabled=false;
    }else{
      $('rangeRow').classList.add('hide');$('info').textContent='Preparing photos…';
      for(const f of files.slice(0,MAXIMG))imgs.push(await photoB64(f));
      mode='photos';
      $('info').textContent=imgs.length+' photo'+(imgs.length>1?'s':'')+' ready (in the order you chose).'+(files.length>MAXIMG?' Only the first '+MAXIMG+' are used.':'');
      $('go').disabled=false;
    }
  }catch(err){$('info').innerHTML='<span class="err">Could not read this file. Try another one.</span>'}
};

$('go').onclick=async()=>{
  $('go').disabled=true;$('msg').textContent='Getting pages ready…';
  const payload={count:+$('count').value,lang:$('lang').value,firstPage:1};
  try{
    if(mode==='photos'){payload.images=imgs}
    else{
      const a=Math.max(1,+$('from').value),b=Math.min(pages.length,+$('to').value),lim=mode==='scan'?MAXIMG:20;
      if(b<a||b-a+1>lim)throw new Error('Choose 1 to '+lim+' pages');
      if(mode==='scan'){
        payload.firstPage=a;payload.images=[];
        for(let n=a;n<=b;n++){
          const pg=await pdfDoc.getPage(n),v1=pg.getViewport({scale:1}),vp=pg.getViewport({scale:MAXSIDE/Math.max(v1.width,v1.height)});
          const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
          const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
          await pg.render({canvasContext:x,viewport:vp}).promise;
          payload.images.push(c.toDataURL('image/jpeg',QUAL).split(',')[1]);
        }
      }else{
        let t='';for(let n=a;n<=b;n++)t+=`\n[Page ${n}]\n${pages[n-1]}`;
        payload.text=t.slice(0,24000);
      }
    }
    const body=JSON.stringify(payload);
    if(body.length>4000000)throw new Error('Files are too big. Choose fewer pages or photos');
    $('msg').textContent='Making your set… this can take up to a minute.';
    const r=await fetch('/api/book-generate',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+(session?session.access_token:'')},body});
    const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{d={error:'Server problem (HTTP '+r.status+'): '+raw.slice(0,150)}}
    if(!r.ok)throw new Error(d.error||'Failed');
    set=d;$('msg').textContent='';refreshAuth();
    $('nl').innerHTML='';d.notes.forEach(n=>{const li=document.createElement('li');li.textContent=n;$('nl').append(li)});
    show('notes');
  }catch(err){$('msg').innerHTML='<span class="err">'+err.message+'. Try again.</span>'}
  $('go').disabled=false;
};

$('start').onclick=()=>begin(set.mcqs);
function begin(list){deck=list;i=0;wrong=[];correct=0;show('quiz');ask()}
function ask(){
  const m=deck[i];$('prog').textContent=`Question ${i+1} of ${deck.length}`+(m.page?` · from page ${m.page}`:'');
  $('q').textContent=m.q;$('exp').classList.add('hide');$('next').classList.add('hide');$('opts').innerHTML='';
  m.options.forEach((o,k)=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o;
    b.onclick=()=>pick(k);$('opts').append(b);
  });
}
function pick(k){
  const m=deck[i],bs=[...$('opts').children];
  bs.forEach((b,j)=>{b.disabled=true;if(j===m.answer)b.classList.add('right')});
  if(k===m.answer)correct++;else{bs[k].classList.add('wrong');wrong.push(m)}
  $('exp').textContent=m.explain;$('exp').classList.remove('hide');
  $('next').textContent=i===deck.length-1?'See result':'Next';$('next').classList.remove('hide');
}
$('next').onclick=()=>{
  if(++i<deck.length)return ask();
  show('done');$('score').textContent=`You got ${correct} of ${deck.length}`;
  $('wrongInfo').textContent=wrong.length?`${wrong.length} to revise again.`:'All correct. Try new pages.';
  $('retry').classList.toggle('hide',!wrong.length);
};
$('retry').onclick=()=>begin(wrong);
$('again').onclick=()=>show('setup');
</script>
</body>
</html>
