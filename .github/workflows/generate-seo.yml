name: Generate SEO pages
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate pages
        run: node generate-seo-pages.mjs
      - name: Move results into place
        run: |
          cp -r seo-pages/. .
          rm -rf seo-pages
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "SEO: static exam and mock test pages, new sitemap" || echo "No changes"
          git push
