<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" font-family="Arial, sans-serif">
  <rect width="600" height="400" fill="#ffffff" rx="8"/>
  
  <circle cx="200" cy="200" r="140" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>
  
  <!-- Companies 67% => 241.2 deg -->
  <path d="M200,200 L200,60 A140,140 0 0,1 370.0,330.0 Z" fill="#4e79a7"/>
  <text x="270" y="160" fill="#fff" font-size="18" font-weight="bold">67%</text>
  
  <!-- Insurance 5% => 18 deg -->
  <path d="M200,200 L370.0,330.0 A140,140 0 0,1 340.0,330.0 Z" fill="#f28e2b"/>
  <text x="300" y="310" fill="#fff" font-size="12">5%</text>
  
  <!-- NRI 5% => 18 deg -->
  <path d="M200,200 L340.0,330.0 A140,140 0 0,1 222.0,330.0 Z" fill="#e15759"/>
  <text x="280" y="320" fill="#000" font-size="12">5%</text>
  
  <!-- Pension Funds 5% => 18 deg -->
  <path d="M200,200 L222.0,330.0 A140,140 0 0,1 200,340 Z" fill="#59a14f"/>
  <text x="210" y="320" fill="#000" font-size="12">5%</text>
  
  <!-- Retail 7% => 25.2 deg -->
  <path d="M200,200 L200,340 A140,140 0 0,1 70,330 Z" fill="#f2b95d"/>
  <text x="110" y="310" fill="#000" font-size="12">7%</text>
  
  <!-- FII 5% => 18 deg -->
  <path d="M200,200 L70,330 A140,140 0 0,1 60,300 Z" fill="#edc948"/>
  <text x="80" y="290" fill="#000" font-size="12">5%</text>
  
  <!-- Banks 6% => 21.6 deg -->
  <path d="M200,200 L60,300 A140,140 0 0,1 80,100 Z" fill="#af7ac5"/>
  <text x="70" y="190" fill="#fff" font-size="12">6%</text>
  
  <!-- Legend -->
  <g transform="translate(420, 60)">
    <rect x="0" y="0" width="16" height="16" fill="#4e79a7"/><text x="22" y="13" font-size="12" fill="#333">Companies</text>
    <rect x="0" y="24" width="16" height="16" fill="#f28e2b"/><text x="22" y="37" font-size="12" fill="#333">Insurance</text>
    <rect x="0" y="48" width="16" height="16" fill="#e15759"/><text x="22" y="61" font-size="12" fill="#333">NRI</text>
    <rect x="0" y="72" width="16" height="16" fill="#59a14f"/><text x="22" y="85" font-size="12" fill="#333">Pension Funds</text>
    <rect x="0" y="96" width="16" height="16" fill="#f2b95d"/><text x="22" y="109" font-size="12" fill="#333">Retail</text>
    <rect x="0" y="120" width="16" height="16" fill="#edc948"/><text x="22" y="133" font-size="12" fill="#333">FII</text>
    <rect x="0" y="144" width="16" height="16" fill="#af7ac5"/><text x="22" y="157" font-size="12" fill="#333">Banks</text>
  </g>
